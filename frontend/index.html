<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RE:VIVE — Healthcare Recovery Management Platform" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f7f5" media="(prefers-color-scheme: light)" />
    <title>RE:VIVE — Recovery Management Platform</title>

    <!-- Apply the saved theme before the CSS loads, so the page never flashes the wrong one. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('revive_theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) {
                /* storage blocked — fall through to prefers-color-scheme */
            }
        })();
    </script>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⟡</text></svg>" />
</head>
